name: Weekly Pricing FX Update

on:
  schedule:
    # Runs every Monday at 06:00 UTC to check ECB conversion rates (USD -> EUR, CNY) and update localized pricing
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weekly-fx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check FX conversion rates and update EUR & CNY pricing
        run: npm run pricing:weekly-fx

      - name: Run i18n guard and pricing tests
        run: |
          npm run i18n:guard
          npm run test:pricing

      - name: Commit and push updated weekly pricing if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/social-fx.json src/i18n/dict/fr/pages/pricing.json src/i18n/dict/zh/pages/pricing.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(pricing): weekly EUR & CNY conversion rate and pricing update"
            git push
          else
            echo "No FX rate changes to commit."
          fi
