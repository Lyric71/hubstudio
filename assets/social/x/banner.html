<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; font-weight: 500; src: url("file:///C:/Users/cyril/Project/hubstudio/public/fonts/inter-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("file:///C:/Users/cyril/Project/hubstudio/public/fonts/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("file:///C:/Users/cyril/Project/hubstudio/public/fonts/inter-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Playfair Display"; font-style: italic; font-weight: 500; src: url("file:///C:/Users/cyril/Project/hubstudio/public/fonts/playfair-display-latin-500-italic.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("file:///C:/Users/cyril/Project/hubstudio/public/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }

  :root {
    --ink: #0e1633; --cream: #f0ede9; --orange: #e94e1b;
    --create: #e94e1b; --publish: #3f6fe0; --library: #1fa58a;
  }
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 60% 95% at 22% 118%, rgba(233, 78, 27, 0.30), rgba(233, 78, 27, 0) 70%),
      var(--ink);
    font-family: "Inter", sans-serif;
    color: #fff;
  }
  .grain { position: absolute; inset: 0; opacity: 0.09; mix-blend-mode: overlay; pointer-events: none; }

  /* Copy: upper left, ends above the avatar zone (y > 320 at x < 420). */
  .copy { position: absolute; left: 92px; top: 92px; width: 700px; }
  h1 {
    margin: 0; font-weight: 700; font-size: 68px; line-height: 1.02;
    letter-spacing: -0.025em;
  }
  h1 .accent { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; color: var(--orange); letter-spacing: -0.01em; }
  .sub {
    margin: 26px 0 0; font-weight: 500; font-size: 25px; line-height: 1.35;
    color: var(--cream); opacity: 0.86; max-width: 620px;
  }

  /* The app, drawn as its own menu draws it: three pillars under one AI layer. */
  .app { position: absolute; left: 902px; right: 92px; top: 92px; bottom: 0; }
  .layer {
    height: 62px; border-radius: 14px;
    border: 1.5px solid rgba(240, 237, 233, 0.34);
    background: rgba(240, 237, 233, 0.07);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
  }
  .layer .name { font-weight: 600; font-size: 25px; color: var(--cream); }
  .layer .tag { font-family: "JetBrains Mono", monospace; font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(240, 237, 233, 0.62); }
  .pillars {
    position: absolute; left: 0; right: 0; top: 78px; bottom: -14px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  }
  .pillar {
    border-radius: 14px 14px 0 0; padding: 20px 20px;
    display: flex; flex-direction: column; justify-content: flex-start;
  }
  .pillar .name { font-weight: 700; font-size: 29px; letter-spacing: -0.01em; }
  .pillar .what { margin-top: 8px; font-weight: 500; font-size: 18px; line-height: 1.35; opacity: 0.9; }
  .create  { background: var(--create); }
  .publish { background: var(--publish); }
  .library { background: var(--library); }

  .url {
    position: absolute; right: 92px; top: 40px;
    font-family: "JetBrains Mono", monospace; font-size: 17px; letter-spacing: 0.08em;
    color: rgba(240, 237, 233, 0.6);
  }
</style></head>
<body>
  <div class="copy">
    <h1>Images, video and posts, <span class="accent">made</span> with AI.</h1>
    <p class="sub">Make them yourself in the app, or send a brief and our studio makes them for you.</p>
  </div>

  <div class="url">hubstudio.ai</div>

  <div class="app">
    <div class="layer"><span class="name">Agents and Skills</span><span class="tag">AI layer</span></div>
    <div class="pillars">
      <div class="pillar create"><span class="name">Create</span><span class="what">Image and video</span></div>
      <div class="pillar publish"><span class="name">Publish</span><span class="what">Posts and campaigns</span></div>
      <div class="pillar library"><span class="name">Library</span><span class="what">Assets and approvals</span></div>
    </div>
  </div>

  <svg class="grain" width="1500" height="500" xmlns="http://www.w3.org/2000/svg">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</body></html>
